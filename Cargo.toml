[package]
name = "liquid-shell"
version = "0.1.0"
edition = "2021"
description = "Turnkey Wayland desktop shell & rice built on the Liquid Glass physical optical engine"
repository = "https://github.com/ziuus/liquid-shell"
license = "MIT"

[dependencies]
glass-core = { git = "https://github.com/ziuus/liquid-glass.git" }
glass-platform = { git = "https://github.com/ziuus/liquid-glass.git" }
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
wayland-client = "0.31"
wayland-protocols = "0.31"
wayland-protocols-wlr = "0.2"
smithay-client-toolkit = "0.18"
pollster = "0.3"
env_logger = "0.11"
log = "0.4"
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[dev-dependencies]
toml = "0.8"

[[test]]
name = "e2e_wallpaper_contrast"
path = "tests/e2e_wallpaper_contrast.rs"

[[test]]
name = "e2e_idle_cpu"
path = "tests/e2e_idle_cpu.rs"

[[test]]
name = "e2e_config_parsing"
path = "tests/e2e_config_parsing.rs"
